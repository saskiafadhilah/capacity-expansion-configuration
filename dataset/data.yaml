# ============================================================
# Data + Model Configuration
# California Solar + BESS vs Solar + Natural Gas
# Source: NREL ATB 2026, Moderate scenario, Market case
# ============================================================

project:
  name: california_capacity_expansion
  location: California
  model_type: single_node_capacity_expansion
  planning_year: 2026
  snapshots_per_year: 8760
  discount_rate: 0.07
  currency_year: 2026

# ============================================================
# Paths
# ============================================================

paths:
  raw_data_dir: dataset/raw
  processed_data_dir: dataset/processed
  results_dir: results

input_files:
  combined_raw: aggregated_demand_and_solar_2025_normalized.csv

processed_files:
  demand_processed: demand_8760.csv
  solar_processed: solar_cf_8760.csv
  merged_timeseries: timeseries_8760.csv

# ============================================================
# Column mappings
# ============================================================

columns:
  combined:
    date: Date
    hour: HR
    solar_generation_mw: Solar Gen
    solar_normalized: Solar Gen Normalized
    demand_mw: Demand
    demand_normalized: Demand_Normalized

output_columns:
  timestamp: timestamp
  demand_mw: demand_mw
  solar_cf: solar_cf

# ============================================================
# Time settings
# ============================================================

time:
  year: 2025
  hour_indexing: one_to_twenty_four
  date_format: "%m/%d/%Y"

# ============================================================
# Normalization
# ============================================================

normalization:
  demand:
    use_normalized_for_pypsa: false
    source_column: Demand
    normalized_column: Demand_Normalized
    notes: >
      Use actual Demand in MW for PyPSA Load.p_set. Demand_Normalized is only
      for visualization or profile-shape comparison.

  solar:
    use_existing_normalized_column: true
    source_column: Solar Gen
    normalized_column: Solar Gen Normalized
    caiso_solar_nameplate_mw: 22380
    clip_min: 0.0
    clip_max: 1.0
    notes: >
      Use Solar Gen Normalized as PyPSA Generator.p_max_pu. If recalculating
      manually, divide Solar Gen by CAISO installed solar nameplate capacity.

# ============================================================
# Scenario settings
# ============================================================

scenario_settings:
  scenarios:
    - solar_bess
    - solar_bess_8h
    - solar_gas
    - solar_gas_co2cap
    - solar_gas_rps

  use_load_shedding: true
  full_year_hourly: true

  # ── Value of Lost Load (VOLL) ────────────────────────────────
  # VOLL = $30,000/MWh — blended California commercial-industrial estimate.
  # VOLL is applied ONLY to gas scenarios as an unserved load penalty.
  # In BESS scenarios, the battery physically handles all residual demand;
  # VOLL is not needed as a feasibility backstop in those scenarios.
  #
  # Derivation (Gorman & Callaway, 2024; CAISO Price Formation WG, 2025):
  #   Residential:  $12,000/MWh * 35% =  $4,200
  #   Commercial:   $35,000/MWh * 35% = $12,250
  #   Industrial:   $30,000/MWh * 20% =  $6,000
  #   Other:        $25,000/MWh * 10% =  $2,500
  #   Blended:                           $24,950 -> model uses $30,000 (conservative)
  #
  # WARNING: Setting this below $10,000 causes the optimizer to accept
  # excessive load shedding rather than build adequate capacity.
  value_of_lost_load_per_mwh: 30000

  # ── Planning Reserve Margin (PRM) ────────────────────────────
  # 17% above peak demand per CPUC System RA requirement (beginning 2024).
  # Source: CPUC Resource Adequacy Program, R.23-10-011.
  # Decisions: D.24-06-004 (Track 1), D.24-12-003 (Track 2).
  # Previous requirement was 15% — updated to 17% effective 2024.
  # Required firm capacity = 43,923 MW * 1.17 = 51,390 MW
  planning_reserve_margin: 0.17

  # ── ELCC — Effective Load Carrying Capability ─────────────────
  # ELCC_g is the fraction of technology g's nameplate capacity that
  # counts as firm capacity during the top-10 highest net-load hours
  # (the hours when demand minus renewables is greatest).
  #
  # The ELCC-weighted PRM constraint (C6):
  #   ELCC_gas   * P_gas   +
  #   ELCC_solar * P_solar +
  #   ELCC_bess  * P_bess  >= (1 + PRM) * D_peak
  #
  # This replaces the old gas-only p_nom_min approach, which incorrectly
  # credited gas 100% and solar/BESS 0% toward reserve margin.
  #
  # Sources:
  #   natural_gas_cc: CAISO Resource Adequacy qualifying capacity rules
  #                   (CPUC R.23-10-011). Firm dispatchable at any hour.
  #                   5% reduction reflects typical forced outage rate.
  #
  #   solar:          Pham, Cole & Gagnon (2024), NREL/TP-7A40-89587,
  #                   Figure 4 panel 1. CAISO region, 2026 median = 21%.
  #                   Solar output is near-zero at 7-9 PM summer peak.
  #                   ELCC declines with higher solar penetration.
  #
  #   bess_4h:        Pham et al. (2024), Figure 4 panel 4.
  #                   CAISO 2026 average 4-hr battery capacity credit.
  #                   Conservative midpoint; CAISO values typically 88-100%.
  #
  #   bess_8h:        Pham et al. (2024), Figure 4 panel 5.
  #                   8-hr batteries achieve near-100% capacity credit
  #                   in almost all CAISO scenarios through 2036.
  elcc:
    natural_gas_cc: 0.95
    solar:          0.21
    bess_4h:        0.85
    bess_8h:        1.00

# ============================================================
# Technologies
# ============================================================

technologies:

  # ------------------------------------------------------------
  # Utility-scale solar PV
  # NREL ATB 2026, Utility PV, Market scenario
  # ------------------------------------------------------------
  solar:
    enabled: true
    carrier: solar
    capital_extendable: true

    capex_per_kw: 1405.5
    capex_range_per_kw:
      low: 1379
      high: 1432

    overnight_capital_cost_per_kw: 1247.5
    overnight_capital_cost_range_per_kw:
      low: 1228
      high: 1267

    fixed_om_per_kw_year: 20
    fixed_om_range_per_kw_year:
      low: 20
      high: 20

    variable_om_per_mwh: 0
    lifetime_years: 30

    capacity_factor_range:
      low: 0.20
      high: 0.32

    lcoe_range_per_mwh:
      low: 19
      high: 44

    co2_intensity_t_per_mwh: 0

    lifecycle_emissions_gco2e_per_kwh: 43
    lifecycle_breakdown_gco2e_per_kwh:
      one_time_upstream: 28
      ongoing_combustion: 0
      ongoing_non_combustion: 10
      one_time_downstream: 5
      total_life_cycle: 43

    source_notes: >
      NREL ATB 2026 Utility PV, Market scenario. Midpoint CAPEX: 1,405.5 $/kW
      (range 1,379-1,432 $/kW). OCC: 1,247.5 $/kW (range 1,228-1,267 $/kW).
      Fixed O&M: 20 $/kW-yr. LCOE range: 19-44 $/MWh. CF: 0.20-0.32.
      Life-cycle emissions from NREL LCA table: 43 gCO2e/kWh.

  # ------------------------------------------------------------
  # Utility-scale battery storage (4-hour BESS)
  # NREL ATB 2026, Utility-Scale Battery Storage, Market scenario
  # ------------------------------------------------------------
  bess:
    enabled: true
    carrier: battery
    capital_extendable: true

    duration_hours: 4
    roundtrip_efficiency: 0.90

    # SOC window — used to compute usable energy in PyPSA
    # C4:  state_of_charge_min = 0.10 -> E_t >= 0.10 * p_nom * 4h (PyPSA native)
    # C4b: max_state_of_charge = 0.90 -> E_t <= 0.90 * p_nom * 4h (linopy extra_functionality)
    # Usable window: (0.90 - 0.10) * 4h = 3.2h equivalent per MW of power capacity
    min_state_of_charge: 0.10
    max_state_of_charge: 0.90

    initial_state_of_charge: 0.50
    cyclic_state_of_charge: true

    capex_per_kw: 2171.5
    capex_range_per_kw:
      low: 836
      high: 3507

    overnight_capital_cost_per_kw: 1995
    overnight_capital_cost_range_per_kw:
      low: 706
      high: 3284

    fixed_om_per_kw_year: 50
    fixed_om_range_per_kw_year:
      low: 18
      high: 82

    variable_om_per_mwh: 0
    degradation_cost_per_mwh_throughput: 0
    lifetime_years: 15

    co2_intensity_t_per_mwh: 0

    lifecycle_emissions_gco2e_per_kwh: 33
    lifecycle_breakdown_gco2e_per_kwh:
      one_time_upstream: 32
      ongoing_combustion: 0
      ongoing_non_combustion: 0
      one_time_downstream: 3.4
      total_life_cycle: 33

    source_notes: >
      NREL ATB 2026 Utility-Scale Battery Storage, Market scenario.
      Midpoint CAPEX: 2,171.5 $/kW (range 836-3,507 $/kW).
      OCC: 1,995 $/kW (range 706-3,284 $/kW).
      Fixed O&M: 50 $/kW-yr (range 18-82 $/kW-yr).
      Life-cycle emissions: 33 gCO2e/kWh.

  # ------------------------------------------------------------
  # Utility-scale battery storage (8-hour BESS)
  # NREL ATB 2026, Utility-Scale Battery Storage, Market scenario
  # Extended duration variant for solar_bess_8h scenario
  # ------------------------------------------------------------
  bess_8h:
    enabled: true
    carrier: battery
    capital_extendable: true

    duration_hours: 8
    roundtrip_efficiency: 0.85

    # SOC window
    # C4:  state_of_charge_min = 0.05 -> E_t >= 0.05 * p_nom * 8h
    # C4b: max_state_of_charge = 0.95 -> E_t <= 0.95 * p_nom * 8h
    # Usable window: (0.95 - 0.05) * 8h = 7.2h equivalent
    min_state_of_charge: 0.05
    max_state_of_charge: 0.95

    initial_state_of_charge: 0.50
    cyclic_state_of_charge: true

    capex_per_kw: 3200
    fixed_om_per_kw_year: 75
    variable_om_per_mwh: 0
    degradation_cost_per_mwh_throughput: 0
    lifetime_years: 15

    co2_intensity_t_per_mwh: 0

    lifecycle_emissions_gco2e_per_kwh: 33
    lifecycle_breakdown_gco2e_per_kwh:
      one_time_upstream: 32
      ongoing_combustion: 0
      ongoing_non_combustion: 0
      one_time_downstream: 3.4
      total_life_cycle: 33

    source_notes: >
      8-hour BESS variant for solar_bess_8h scenario.
      ELCC = 1.00 (Pham et al., 2024, NREL/TP-7A40-89587, Figure 4 panel 5).
      8-hr batteries achieve near-100% capacity credit in almost all CAISO
      scenarios through 2036. Sufficient duration to cover full evening peak.

  # ------------------------------------------------------------
  # Natural gas combined cycle
  # NREL ATB 2026, Natural Gas CC, Market scenario
  # ------------------------------------------------------------
  natural_gas_cc:
    enabled: true
    carrier: natural_gas_cc
    capital_extendable: true

    capex_per_kw: 1513
    capex_range_per_kw:
      low: 1310
      high: 1716

    overnight_capital_cost_per_kw: 1257.5
    overnight_capital_cost_range_per_kw:
      low: 1075
      high: 1440

    fixed_om_per_kw_year: 32.5
    fixed_om_range_per_kw_year:
      low: 26
      high: 39

    variable_om_per_mwh: 4.5
    variable_om_range_per_mwh:
      low: 2.1
      high: 6.9

    lifetime_years: 30

    # Fuel and carbon cost assumptions
    heat_rate_mmbtu_per_mwh: 6.8
    fuel_price_per_mmbtu: 4.0
    fuel_cost_per_mwh: 27.2
    carbon_price_per_tco2: 30
    carbon_cost_per_mwh: 10.8
    marginal_cost_per_mwh: 42.5
    co2_intensity_t_per_mwh: 0.36

    lifecycle_emissions_gco2e_per_kwh: 486
    lifecycle_breakdown_gco2e_per_kwh:
      one_time_upstream: 0.8
      ongoing_combustion: 389
      ongoing_non_combustion: 71
      one_time_downstream: 0.02
      total_life_cycle: 486

    source_notes: >
      NREL ATB 2026 Natural Gas CC, Market scenario.
      Midpoint CAPEX: 1,513 $/kW (range 1,310-1,716 $/kW).
      OCC: 1,257.5 $/kW (range 1,075-1,440 $/kW).
      Fixed O&M: 32.5 $/kW-yr (range 26-39 $/kW-yr).
      Variable O&M: 4.5 $/MWh. Fuel: 6.8 MMBtu/MWh * 4.0 $/MMBtu = 27.2 $/MWh.
      Carbon: 0.36 tCO2/MWh * 30 $/tCO2 = 10.8 $/MWh.
      Total marginal: 4.5 + 27.2 + 10.8 = 42.5 $/MWh.
      Life-cycle emissions: 486 gCO2e/kWh.

  # ------------------------------------------------------------
  # PV-plus-battery (reference only — not modeled separately)
  # ------------------------------------------------------------
  solar_plus_battery:
    enabled: false
    carrier: solar_plus_battery
    capex_per_kw: 2077
    capex_range_per_kw:
      low: 1963
      high: 2191
    overnight_capital_cost_per_kw: 1896
    fixed_om_per_kw_year: 55
    variable_om_per_mwh: 0
    lifetime_years: 30
    co2_intensity_t_per_mwh: 0

# ============================================================
# Capacity limits (null = free optimization)
# ============================================================

capacity_limits:
  solar:
    min_capacity_mw: 0
    max_capacity_mw:
  bess:
    min_power_capacity_mw: 0
    max_power_capacity_mw:
    min_energy_capacity_mwh: 0
    max_energy_capacity_mwh:
  natural_gas_cc:
    min_capacity_mw: 0
    max_capacity_mw:

# ============================================================
# Emissions accounting
# ============================================================

emissions_accounting:
  include_operational_emissions: true
  include_lifecycle_emissions: true
  social_cost_of_carbon_per_tco2: 30
  notes: >
    Life-cycle emissions factors in gCO2e/kWh. Operational and life-cycle
    emissions are reported separately in the summary output.

# ============================================================
# Outputs
# ============================================================

outputs:
  save_dispatch: true
  save_state_of_charge: true
  save_summary: true
  save_comparison: true

  metrics:
    - total_cost
    - average_cost_per_mwh
    - load_mwh
    - solar_capacity_mw
    - solar_generation_mwh
    - solar_curtailment_mwh
    - battery_power_mw
    - battery_energy_mwh
    - battery_throughput_mwh
    - gas_capacity_mw
    - gas_generation_mwh
    - emissions_tco2
    - load_shedding_mwh

# ============================================================
# Policy constraints
# ============================================================

constraints:
  # Scenario solar_gas_co2cap:
  # CPUC 2035 target, CAISO share ~25 MtCO2 (Decision 24-02-047, Feb 2024)
  co2_cap_tco2_per_year: 25000000

  # Scenario solar_gas_rps:
  # California SB 100 (2018) — 60% renewables by 2030
  min_renewable_fraction: 0.60
